        function statLabel(id, v) {
            let steps = statLabels[id];
            let label = steps[0][1];
            for (let i = 0; i < steps.length; i++) {
                if (v >= steps[i][0]) label = steps[i][1]; else break;
            }
            return label;
        }
        function refreshStatLabels() {
            Object.keys(statLabels).forEach(id => {
                let v = parseFloat(g(id).value);
                if (isNaN(v)) v = 0;
                g('sd-' + id).textContent = statLabel(id, v);
                let slider = g(id + '-s');
                if (slider) slider.value = Math.max(0, Math.min(200, v));
            });
            updateTCG();
        }
        function num(id) { let v = parseFloat(g(id).value); return isNaN(v) ? 0 : v; }
        function updateTCG() {
            let atk = num('str') * 0.40 + num('mag') * 0.30 + num('spd') * 0.10 + num('abl') * 0.20;
            let def = num('dur') * 0.50 + num('str') * 0.20 + num('spd') * 0.10 + num('mag') * 0.10 + num('abl') * 0.10;
            let inf = (num('wth') + num('aut') + num('rep') + num('fol') + num('ter') + num('kno') + num('con')) / 7;
            g('tcg-atk').textContent = atk.toFixed(1);
            g('tcg-def').textContent = def.toFixed(1);
            g('tcg-inf').textContent = inf.toFixed(1);
            g('tcg-cost').textContent = ((atk + def + inf) / 20).toFixed(1);
        }
        function init() { g('species').innerHTML=''; Object.keys(species).forEach(k => g('species').add(new Option(k, k))); classes.forEach(c => g('cls').add(new Option(c, c))); g('species').onchange = applySpecies; Object.keys(statLabels).forEach(id => { let inp = g(id); inp.addEventListener('input', refreshStatLabels); let slider = document.createElement('input'); slider.type = 'range'; slider.min = 0; slider.max = 200; slider.className = 'stat-slider'; slider.id = id + '-s'; inp.insertAdjacentElement('afterend', slider); slider.addEventListener('input', () => { inp.value = slider.value; refreshStatLabels(); }); }); g('charImg').addEventListener('change', e => { let f = e.target.files[0]; if (!f) return; let reader = new FileReader(); reader.onload = ev => { let img = new Image(); img.onload = () => { let c = document.createElement('canvas'); let s = Math.min(1, 400 / Math.max(img.width, img.height)); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); currentImage = c.toDataURL('image/jpeg', 0.8); let p = g('charImgPrev'); p.src = currentImage; p.style.display = 'block'; }; img.src = ev.target.result; }; reader.readAsDataURL(f); }); applySpecies(); refreshLibrary(); }

        function rank(v) { if (v >= 1100) return 'SSS'; if (v >= 950) return 'SS'; if (v >= 800) return 'S'; if (v >= 650) return 'A'; if (v >= 500) return 'B'; if (v >= 350) return 'C'; if (v >= 200) return 'D'; if (v >= 100) return 'E'; return 'F'; }
        function scores(d) { let t = (+d.str) * 2 + (+d.spd) * 1.5 + (+d.dur) * 2 + (+d.mag) * 2 + (+d.intel) + (+d.abl) * 2 + (+d.res) * 1.5; let i = (+d.wth) * 2 + (+d.aut) * 3 + (+d.rep) * 1.5 + (+d.fol) * 2 + (+d.ter) * 2 + (+d.kno) + (+d.con) * 2; let w = t * 0.6 + i * 0.4; return { threat: t, influence: i, world: w, worldRank: rank(w) } }

        function deleteCharacter() { if (g('library').value) { localStorage.removeItem(g('library').value); refreshLibrary(); } }
        function refreshLibrary() { ['library', 'compareA', 'compareB'].forEach(id => g(id).innerHTML = ''); Object.keys(localStorage).filter(k => k.startsWith('fc_')).forEach(k => { let d = JSON.parse(localStorage.getItem(k)); let txt = d.name + ' • ' + d.species + ' • L' + d.level + ' • ' + d.worldRank;['library', 'compareA', 'compareB'].forEach(id => g(id).add(new Option(txt, k))); }); }
        function difficulty(diff) { diff = Math.abs(diff); if (diff < 50) return 'Even'; if (diff < 150) return 'Difficult'; if (diff < 300) return 'Hard'; if (diff < 500) return 'Overwhelming'; return 'Impossible'; }
        function compareCharacters() { let a = JSON.parse(localStorage.getItem(g('compareA').value)); let b = JSON.parse(localStorage.getItem(g('compareB').value)); if (!a || !b) return; let combat = a.threat > b.threat ? a.name : b.name; let political = a.influence > b.influence ? a.name : b.name; let overall = a.world > b.world ? a.name : b.name; g('comparison').innerHTML = '<table class="cmp"><tr><th>Stat</th><th>' + a.name + '</th><th>' + b.name + '</th></tr><tr><td>Threat</td><td>' + a.threat.toFixed(1) + '</td><td>' + b.threat.toFixed(1) + '</td></tr><tr><td>Influence</td><td>' + a.influence.toFixed(1) + '</td><td>' + b.influence.toFixed(1) + '</td></tr><tr><td>World</td><td>' + a.world.toFixed(1) + '</td><td>' + b.world.toFixed(1) + '</td></tr><tr><td>Strength</td><td>' + a.str + '</td><td>' + b.str + '</td></tr><tr><td>Magic</td><td>' + a.mag + '</td><td>' + b.mag + '</td></tr><tr><td>Authority</td><td>' + a.aut + '</td><td>' + b.aut + '</td></tr></table><p><b>Combat Winner:</b> ' + combat + '</p><p><b>Political Winner:</b> ' + political + '</p><p><b>Overall Winner:</b> ' + overall + '</p><p><b>Difficulty:</b> ' + difficulty(a.world - b.world) + '</p>'; }
       function saveSpeciesPreset() {

    let name = g('species').value;

    species[name].stats = {

        str:+g('str').value,
        spd:+g('spd').value,
        dur:+g('dur').value,
        mag:+g('mag').value,
        intel:+g('intel').value,
        abl:+g('abl').value,
        res:+g('res').value

    };
species[name].desc =
    g('speciesDesc').value;

species[name].rank =
    g('speciesRank').value;

    localStorage.setItem(
        "speciesPresets",
        JSON.stringify(species)
    );

    applySpecies();

    alert(name + " Saved");

}

function createSpeciesPreset() {

    let name = g('newSpeciesName').value.trim();

    if (!name) {
        alert("Enter a species name first");
        return;
    }

    if (species[name]) {
        alert(name + " already exists");
        return;
    }

    g('newSpeciesName').value = '';

    species[name] = {
        locked:false,

        rank: "D",

        desc: "Custom Species",

        stats: {

            str: +g('str').value,
            spd: +g('spd').value,
            dur: +g('dur').value,
            mag: +g('mag').value,
            intel: +g('intel').value,
            abl: +g('abl').value,
            res: +g('res').value

        },

        subs: ["Default"]

    };

    localStorage.setItem(
        "speciesPresets",
        JSON.stringify(species)
    );

    g('species').add(
        new Option(name, name)
    );

    g('species').value = name;

    applySpecies();

}

function deleteSpeciesPreset() {

    let name = g('species').value;

    if (species[name].locked) {

        alert(
            name +
            " is locked and cannot be deleted"
        );

        return;

    }

    if (!confirm("Delete " + name + "?"))
        return;

    delete species[name];

    localStorage.setItem(
        "speciesPresets",
        JSON.stringify(species)
    );

    g('species').innerHTML = '';

    Object.keys(species).forEach(k => {

        g('species')
            .add(new Option(k, k));

    });

    g('species').value = 'Human';

    applySpecies();

    alert(name + " Deleted");

}
function toggleSpeciesLock() {

    let name = g('species').value;

    species[name].locked =
        !species[name].locked;

    localStorage.setItem(
        "speciesPresets",
        JSON.stringify(species)
    );

    applySpecies();

    alert(
        name +
        (species[name].locked
            ? " Locked"
            : " Unlocked")
    );

}
        window.onload = init;
    </script>
