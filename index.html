<!DOCTYPE html>

<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>Fantasy Ranking Calculator V6.1</title>
<style>
body{font-family:Segoe UI,Arial;background:#101318;color:#eee;max-width:1700px;margin:auto;padding:20px}
.section{background:#1d232c;padding:15px;border-radius:10px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
label{display:block;font-weight:bold;margin-bottom:4px}
input,select,button{width:100%;padding:8px;background:#2a313d;color:#fff;border:1px solid #555;border-radius:6px}
button{background:#b8860b}.card{background:#151a20;padding:10px;border-radius:8px}.badge{background:gold;color:#000;padding:4px 8px;border-radius:5px;font-weight:bold}.cmp{width:100%;border-collapse:collapse}.cmp td,.cmp th{border:1px solid #555;padding:6px}
</style></head><body>
<h1>Fantasy Ranking Calculator V6.1</h1>
<div class="section">
<label>Name</label><input id="name" value="Unnamed Entity">
<div class="grid">
<div><label>Species</label><select id="species"><option value="Human">Human</option><option value="Elf">Elf</option><option value="Dragon">Dragon</option></select></div>
<div><label>Subspecies</label><select id="subspecies"><option value="Red Dragon">Red Dragon</option><option value="Blue Dragon">Blue Dragon</option><option value="Ancient Dragon">Ancient Dragon</option><option value="Elder Dragon">Elder Dragon</option></select></div>
<div><label>Class</label><select id="cls"><option value="Warrior">Warrior</option><option value="Mage">Mage</option><option value="Assassin">Assassin</option><option value="King">King</option></select></div>
<div><label>Level</label><input id="level" type="number" min="1" max="100" value="1"></div>
</div><div id="speciesInfo" class="card"><b>Dragon</b><br>Ancient apex predators<br>Average Rank: S</div>
</div>
<div class="section"><h3>Threat Stats</h3><div class="grid">
<div><label>Strength</label><input id="str" type="number"></div><div><label>Speed</label><input id="spd" type="number"></div><div><label>Durability</label><input id="dur" type="number"></div><div><label>Magic</label><input id="mag" type="number"></div><div><label>Intelligence</label><input id="intel" type="number"></div><div><label>Abilities</label><input id="abl" type="number"></div><div><label>Resources</label><input id="res" type="number"></div></div></div>
<div class="section"><h3>Influence Stats</h3><div class="grid">
<div><label>Wealth</label><input id="wth" value="50"></div><div><label>Authority</label><input id="aut" value="50"></div><div><label>Reputation</label><input id="rep" value="50"></div><div><label>Followers</label><input id="fol" value="50"></div><div><label>Territory</label><input id="ter" value="50"></div><div><label>Knowledge</label><input id="kno" value="50"></div><div><label>Connections</label><input id="con" value="50"></div></div></div>
<div class="section"><button onclick="calculate()">Calculate</button><button onclick="saveCharacter()">Save Character</button><button onclick="loadCharacter()">Load Character</button><button onclick="deleteCharacter()">Delete Character</button><select id="library"></select></div>
<div class="section"><h3>Character Card</h3><div id="card"></div></div>
<div class="section"><h3>Comparison Center</h3><div class="grid"><div><label>Character A</label><select id="compareA"></select></div><div><label>Character B</label><select id="compareB"></select></div></div><button onclick="compareCharacters()">Compare</button><div id="comparison"></div></div>
<script>
const species={Human:{rank:'D',desc:'Adaptable generalists',stats:{str:50,spd:50,dur:50,mag:30,intel:50,abl:40,res:40},subs:['Commoner','Soldier','Merchant','Noble']},Elf:{rank:'C',desc:'Long-lived magical beings',stats:{str:40,spd:70,dur:40,mag:70,intel:65,abl:60,res:40},subs:['Wood Elf','High Elf','Dark Elf']},Dragon:{rank:'S',desc:'Ancient apex predators',stats:{str:95,spd:80,dur:95,mag:90,intel:75,abl:95,res:70},subs:['Red Dragon','Blue Dragon','Ancient Dragon','Elder Dragon']}};
const classes=['Warrior','Mage','Assassin','King'];
function g(i){return document.getElementById(i)}
function init(){Object.keys(species).forEach(k=>g('species').add(new Option(k,k)));classes.forEach(c=>g('cls').add(new Option(c,c)));g('species').onchange=applySpecies;applySpecies();refreshLibrary();}
function applySpecies(){let sp=species[g('species').value];g('subspecies').innerHTML='';sp.subs.forEach(x=>g('subspecies').add(new Option(x,x)));Object.entries(sp.stats).forEach(([k,v])=>g(k).value=v);g('speciesInfo').innerHTML='<b>'+g('species').value+'</b><br>'+sp.desc+'<br>Average Rank: '+sp.rank;}
function rank(v){if(v>=1100)return'SSS';if(v>=950)return'SS';if(v>=800)return'S';if(v>=650)return'A';if(v>=500)return'B';if(v>=350)return'C';if(v>=200)return'D';if(v>=100)return'E';return'F';}
function scores(d){let t=(+d.str)*2+(+d.spd)*1.5+(+d.dur)*2+(+d.mag)*2+(+d.intel)+(+d.abl)*2+(+d.res)*1.5;let i=(+d.wth)*2+(+d.aut)*3+(+d.rep)*1.5+(+d.fol)*2+(+d.ter)*2+(+d.kno)+(+d.con)*2;let w=t*0.6+i*0.4;return{threat:t,influence:i,world:w,worldRank:rank(w)}}
function collect(){return {name:g('name').value,species:g('species').value,subspecies:g('subspecies').value,cls:g('cls').value,level:g('level').value,str:str.value,spd:spd.value,dur:dur.value,mag:mag.value,intel:intel.value,abl:abl.value,res:res.value,wth:wth.value,aut:aut.value,rep:rep.value,fol:fol.value,ter:ter.value,kno:kno.value,con:con.value};}
function calculate(){let d=collect();let s=scores(d);g('card').innerHTML='<div class=card><h2>'+d.name+'</h2><p>'+d.species+' / '+d.subspecies+'</p><p>Class: '+d.cls+' | Level '+d.level+'</p><p>Threat: '+s.threat.toFixed(1)+'</p><p>Influence: '+s.influence.toFixed(1)+'</p><p>World: '+s.world.toFixed(1)+' <span class=badge>'+s.worldRank+'</span></p></div>';return {...d,...s};}
function saveCharacter(){let c=calculate();localStorage.setItem('fc_'+c.name,JSON.stringify(c));refreshLibrary();}
function loadCharacter(){let d=JSON.parse(localStorage.getItem(g('library').value));if(!d)return;Object.keys(d).forEach(k=>{let e=g(k);if(e)e.value=d[k]});calculate();}
function deleteCharacter(){if(g('library').value){localStorage.removeItem(g('library').value);refreshLibrary();}}
function refreshLibrary(){['library','compareA','compareB'].forEach(id=>g(id).innerHTML='');Object.keys(localStorage).filter(k=>k.startsWith('fc_')).forEach(k=>{let d=JSON.parse(localStorage.getItem(k));let txt=d.name+' • '+d.species+' • L'+d.level+' • '+d.worldRank;['library','compareA','compareB'].forEach(id=>g(id).add(new Option(txt,k)));});}
function difficulty(diff){diff=Math.abs(diff);if(diff<50)return'Even';if(diff<150)return'Difficult';if(diff<300)return'Hard';if(diff<500)return'Overwhelming';return'Impossible';}
function compareCharacters(){let a=JSON.parse(localStorage.getItem(g('compareA').value));let b=JSON.parse(localStorage.getItem(g('compareB').value));if(!a||!b)return;let combat=a.threat>b.threat?a.name:b.name;let political=a.influence>b.influence?a.name:b.name;let overall=a.world>b.world?a.name:b.name;g('comparison').innerHTML='<table class="cmp"><tr><th>Stat</th><th>'+a.name+'</th><th>'+b.name+'</th></tr><tr><td>Threat</td><td>'+a.threat.toFixed(1)+'</td><td>'+b.threat.toFixed(1)+'</td></tr><tr><td>Influence</td><td>'+a.influence.toFixed(1)+'</td><td>'+b.influence.toFixed(1)+'</td></tr><tr><td>World</td><td>'+a.world.toFixed(1)+'</td><td>'+b.world.toFixed(1)+'</td></tr><tr><td>Strength</td><td>'+a.str+'</td><td>'+b.str+'</td></tr><tr><td>Magic</td><td>'+a.mag+'</td><td>'+b.mag+'</td></tr><tr><td>Authority</td><td>'+a.aut+'</td><td>'+b.aut+'</td></tr></table><p><b>Combat Winner:</b> '+combat+'</p><p><b>Political Winner:</b> '+political+'</p><p><b>Overall Winner:</b> '+overall+'</p><p><b>Difficulty:</b> '+difficulty(a.world-b.world)+'</p>';}
window.onload=init;
</script>
</body></html>
